# Runs on every pull request and on every merge group, so main only ever
# receives commits that pass the same checks as `pnpm check`.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:check

  ci:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Install the package manager version declared by the project.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # Browser smoke tests and axe checks against a production build started
  # locally using the browser suite's production server configuration.
  # A separate job so the required `ci` check is not slowed, and not
  # required itself yet.
  smoke:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  metrics:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:metrics
      - run: pnpm preview:metrics

      - name: Write metrics summary
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const build = JSON.parse(readFileSync('artifacts/cloudflare-build-metrics.json', 'utf8'));
          const preview = JSON.parse(readFileSync('artifacts/cloudflare-preview-metrics.json', 'utf8'));
          const lines = [
            '## Cloudflare build metrics',
            '',
            `- Revision: \`${build.revision}\``,
            `- Build time: ${(build.buildMs / 1000).toFixed(1)} s`,
            `- Worker JavaScript: ${(build.workerBytes / 1024 / 1024).toFixed(2)} MiB`,
            `- Static assets: ${(build.staticAssetBytes / 1024 / 1024).toFixed(2)} MiB across ${build.staticAssetFiles} files`,
            `- Tracked source lines: ${build.sourceLines.toLocaleString()}`,
            '',
            `Browser medians (${preview.samplesPerRoute} samples per route; milliseconds except CLS):`,
            '',
            '| Route | TTFB | FCP | LCP | CLS |',
            '| --- | ---: | ---: | ---: | ---: |',
            ...Object.entries(preview.routes).map(([route, metrics]) =>
              `| \`${route}\` | ${metrics.ttfbMs} | ${metrics.fcpMs ?? 'n/a'} | ${metrics.lcpMs ?? 'n/a'} | ${metrics.cls} |`
            ),
            '',
            'Informational only; no metric budgets are enforced.',
            '',
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare-build-metrics
          path: artifacts/cloudflare-*-metrics.json
