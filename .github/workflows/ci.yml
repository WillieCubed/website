# Runs on pull requests, merge groups, and pushes to main, so main only ever
# receives commits that pass the same checks as `pnpm check`. Pushes to other
# branches are left to their pull request, so each run happens once.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `pnpm build` runs `content:check` in its prebuild step, so content
  # problems fail here without a job of their own. The browser smoke tests
  # and axe checks reuse that build through the browser suite's production
  # server configuration.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Install the package manager version declared by the project.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Keep the Playwright browser between runs; the install below still
      # adds the system packages it needs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('playwright-report/**') != '' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Times its own OpenNext build and serves it with Wrangler, so it cannot
  # reuse the Next.js build above.
  metrics:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      # Keep the Playwright browser between runs; the install below still
      # adds the system packages it needs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:metrics
      - run: pnpm preview:metrics

      - name: Write metrics summary
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const build = JSON.parse(readFileSync('artifacts/cloudflare-build-metrics.json', 'utf8'));
          const preview = JSON.parse(readFileSync('artifacts/cloudflare-preview-metrics.json', 'utf8'));
          const metricsGuide = [
            process.env.GITHUB_SERVER_URL,
            process.env.GITHUB_REPOSITORY,
            'blob',
            build.revision,
            'docs/reference/operations/build-metrics.md',
          ].join('/');
          const lines = [
            '## Cloudflare build metrics',
            '',
            `[Metric definitions and collection details](${metricsGuide})`,
            '',
            `- Revision: \`${build.revision}\``,
            `- Build time: ${(build.buildMs / 1000).toFixed(1)} s`,
            `- Worker JavaScript: ${(build.workerBytes / 1024 / 1024).toFixed(2)} MiB`,
            `- Static assets: ${(build.staticAssetBytes / 1024 / 1024).toFixed(2)} MiB across ${build.staticAssetFiles} files`,
            `- Tracked source lines: ${build.sourceLines.toLocaleString()}`,
            '',
            `Browser medians (${preview.samplesPerRoute} samples per route; milliseconds except CLS):`,
            '',
            '| Route | TTFB | FCP | LCP | CLS |',
            '| --- | ---: | ---: | ---: | ---: |',
            ...Object.entries(preview.routes).map(([route, metrics]) =>
              `| \`${route}\` | ${metrics.ttfbMs} | ${metrics.fcpMs ?? 'n/a'} | ${metrics.lcpMs ?? 'n/a'} | ${metrics.cls} |`
            ),
            '',
            'Informational only; no metric budgets are enforced.',
            '',
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare-build-metrics
          path: artifacts/cloudflare-*-metrics.json
