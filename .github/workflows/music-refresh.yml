name: Refresh approved music
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: music-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.MUSIC_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Refresh only approved playlists
        env:
          MUSIC_REFRESH_SECRET: ${{ secrets.MUSIC_REFRESH_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 290 \
            --request POST --header "Authorization: Bearer $MUSIC_REFRESH_SECRET" \
            https://willie.page/api/music/refresh
