name: IndieWeb publish notifications

on:
  check_run:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  notify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'check_run' &&
       github.event.check_run.app.id == 85455 &&
       github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
       github.event.check_run.name == 'Workers Builds: willie-page' &&
       github.event.check_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Serialize publishing without replacing another revision's pending job.
      group: indieweb-publish-production
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify the deployed revision and notify subscribers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_SECRET: ${{ secrets.INDIEWEB_NOTIFY_SECRET_PRODUCTION }}
        run: node scripts/indieweb/publish-notifications.mts
