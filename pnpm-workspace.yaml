packages:
  - .

allowBuilds:
  bufferutil: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

peerDependencyRules:
  allowedVersions:
    tailwindcss: 4.3.0

overrides:
  '@types/react': 19.2.16
  '@types/react-dom': 19.2.3
  sharp: 0.35.5
  'gray-matter>js-yaml': 4.3.2
  '@tailwindcss/typography>postcss-selector-parser': 7.1.6

patchedDependencies:
  gray-matter@4.0.3: patches/gray-matter@4.0.3.patch
  next@16.3.8: patches/next@16.3.8.patch

minimumReleaseAgeExclude:
  - '@cloudflare/build-output-utils@0.9.1'
  - '@cloudflare/config@0.25.0'
  - '@cloudflare/runtime-types@0.1.10'
  - cf@1.0.0-beta.15
  - miniflare@5.20261006.2-beta
